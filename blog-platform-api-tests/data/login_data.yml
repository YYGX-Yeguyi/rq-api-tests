cases:
  - name: 登录成功
    username: admin
    password: "123456"
    expect_code: 200
    expect_token: true
  - name: 密码错误
    username: admin
    password: wrong
    expect_code: 401
    expect_message: 密码错误
  - name: 用户不存在
    username: nobody
    password: "123456"
    expect_code: 404
    expect_message: 用户不存在