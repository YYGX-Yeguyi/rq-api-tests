name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        working-directory: blog-platform-api-tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行接口测试
        working-directory: blog-platform-api-tests
        run: pytest --env=test -v --alluredir=allure-results
        continue-on-error: true

      - name: 上传 Allure 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: blog-platform-api-tests/allure-results/