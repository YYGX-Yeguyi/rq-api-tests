name: UI Tests

on:
  workflow_dispatch:      # 只手动触发，不自动跑
  # push:                 # 想自动跑就放开这行，但会很慢

jobs: 
  ui-test:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        working-directory: blog-ui-tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: 运行 UI 测试
        working-directory: blog-ui-tests
        env:
          BASE_UI_URL: http://47.116.30.242      # 前端已部署地址
        run: pytest -v
        continue-on-error: true

      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: blog-ui-tests/screenshots/